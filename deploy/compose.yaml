name: zyrex-ma
x-app: &app
  image: zyrex-ma-php:1
  working_dir: /var/www/html
  volumes:
    - ./source:/var/www/html
  env_file: .env
  restart: unless-stopped
  mem_limit: 384m
  cpus: 0.50
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  app:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: php artisan horizon
    mem_limit: 512m
  scheduler:
    <<: *app
    command: php artisan schedule:work
    mem_limit: 192m
  web:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:18280:80']
    volumes:
      - ./source/public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    logging: *logging
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zyrex_ma
      POSTGRES_USER: zyrex_ma
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ['pgdata:/var/lib/postgresql/data']
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zyrex_ma']
      interval: 10s
      retries: 10
    logging: *logging
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy noeviction
    volumes: ['redisdata:/data']
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5
    logging: *logging
volumes:
  pgdata:
  redisdata:
networks:
  default:
    ipam:
      config:
        - subnet: 10.241.50.0/24
