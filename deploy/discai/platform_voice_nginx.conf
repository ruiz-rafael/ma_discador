# Central administrative SIP audio. Never reuse tenant cookies or relax tenant origins.
location = /_discai_platform_voice_auth {
 internal;
 proxy_pass http://127.0.0.1:19090/platform-calling/voice-authorize;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header Cookie $http_cookie;
 proxy_set_header Accept application/json;
}
location = /platform-calling/voice/ws {
 if ($http_origin != "https://app.discai.ia.br") { return 403; }
 auth_request /_discai_platform_voice_auth;
 proxy_pass http://127.0.0.1:18488/ws;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_read_timeout 300s;
 proxy_send_timeout 90s;
 proxy_buffering off;
}
