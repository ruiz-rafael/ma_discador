# Start only this service; do not recreate app, PBX, or other workloads.
services:
  speech:
    image: zyrex-ma-speech:1
    build: ./speech
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 64
    user: '82:82'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./speech-runtime/service.env
    volumes:
      - ./speech-runtime/models:/models:ro
      - ./source/storage/app/private/speech:/data
    tmpfs: ['/tmp:rw,exec,nosuid,size=64m']
    networks: [default]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
