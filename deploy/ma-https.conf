server {
 listen 80;
 listen [::]:80;
 server_name ma.zyrex.ia.br;
 location ^~ /.well-known/acme-challenge/ { root /srv/zyrex-ma/acme; }
 location / { return 301 https://ma.zyrex.ia.br$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name ma.zyrex.ia.br;
 ssl_certificate /etc/letsencrypt/live/ma.zyrex.ia.br/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ma.zyrex.ia.br/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /internal/voice/audio/event { return 404; }
 location = /_ma_voice_auth {
  internal;
  proxy_pass http://127.0.0.1:18280/api/voice/audio/authorize;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $host;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Accept application/json;
 }
 location = /voice/ws {
  if ($http_origin != "https://ma.zyrex.ia.br") { return 403; }
  auth_request /_ma_voice_auth;
  proxy_pass http://127.0.0.1:18488/ws;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 90s;
  proxy_send_timeout 90s;
  proxy_buffering off;
 }
 location / {
  proxy_pass http://127.0.0.1:18280;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
 }
}
