# Complement MA compose.yaml. Start only chatterbox; Kokoro remains separate.
services:
  chatterbox:
    image: zyrex-ma-chatterbox:ptbr-20261007
    build: ./chatterbox
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1.5
    pids_limit: 96
    user: '82:82'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./speech-runtime/service.env
    volumes:
      - ./chatterbox-runtime/models:/models:ro
      - ./source/storage/app/private/speech/chatterbox:/data
    tmpfs: ['/tmp:rw,exec,nosuid,size=128m']
    networks: [default]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
